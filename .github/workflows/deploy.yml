# Destination: discuva-api/.github/workflows/deploy.yml
# (local folder discuva-api ↔ GitHub repo ayenijeremiaho/discovery-hub)
#
# No build-args here — discuva-api's Dockerfile takes none that matter
# (only a cosmetic `PORT` ARG that just affects the EXPOSE metadata, not
# runtime binding — the app reads PORT from the container's runtime env at
# `docker run`/compose time instead, via env_file: env/api.env on the
# droplet). All of discuva-api's real config is runtime env, not build-time.
#
# Tenant-schema migrations (src/migrations/tenant/) are NOT run by this
# workflow — they're applied by fly.toml's own `release_command`
# (`node dist/migrate-all-tenants.js`), which Fly runs automatically on a
# fresh machine using the new image before promoting it to receive traffic,
# right after `flyctl deploy` below. Nothing extra needed here. Public-
# schema migrations still run separately, automatically on boot
# (`migrationsRun: true` in db.config.ts).
name: Build and Deploy discuva-api

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Also deploy to production after building"
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/discuva-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.deploy
    environment: production
    permissions:
      contents: read
      packages: read # needs to pull the image build-and-push just pushed, before flyctl re-pushes it into Fly's registry
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # flyctl deploy --image cannot pull a private third-party image itself —
      # GHCR packages are private by default, and Fly has no credentials of
      # its own for a registry it doesn't own. So this job pulls the image
      # here (already GHCR-authenticated above) and re-pushes it into Fly's
      # own registry first. Still not a build — Fly's remote-builder machine
      # is never invoked, this is a plain image copy.
      - name: Push image into Fly's own registry
        run: |
          flyctl auth docker
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.short_sha }}
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.short_sha }} registry.fly.io/discuva-api:${{ needs.build-and-push.outputs.short_sha }}
          docker push registry.fly.io/discuva-api:${{ needs.build-and-push.outputs.short_sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy prebuilt image to Fly.io
        run: |
          flyctl deploy \
            --config fly.toml \
            --app discuva-api \
            --image registry.fly.io/discuva-api:${{ needs.build-and-push.outputs.short_sha }} \
            --strategy rolling
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
