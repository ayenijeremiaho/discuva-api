{{#if heading}}<h1>{{ heading }}</h1>{{/if}}
{{{ message_html }}}
<table class="detail-table" cellpadding="0" cellspacing="0" role="presentation">
                      <tr>
                        <td><strong>Title:</strong> {{ title }}</td>
                      </tr>
                      <tr>
                        <td><strong>Location:</strong> {{ location }}</td>
                      </tr>
                      <tr>
                        <td><strong>Report ID:</strong> {{ reportId }}</td>
                      </tr>
                    </table>
<table width="100%" cellpadding="0" cellspacing="0" role="presentation"
                           style="margin: 30px 0; text-align: center;">
                      <tr>
                        <td>
                          <a href="{{admin_login_url}}" class="button" target="_blank">View in Admin Portal</a>
                        </td>
                      </tr>
                    </table>
<p style="margin-top: 16px; font-size: 13px; color: #8A817C; text-align: center;">Can't click the
                      button? Copy and paste this link into your browser:</p>
<p
                      style="word-break: break-all; font-size: 12px; text-align: center; background-color: #f5f5f5; padding: 10px 16px; border-radius: 4px; margin: 0 0 24px;">
                      <a href="{{admin_login_url}}"
                         style="color: #4F46E5; text-decoration: none;">{{ admin_login_url }}</a></p>
{{{ closing_html }}}
