{{#if heading}}<h1>{{ heading }}</h1>{{/if}}
<table class="alert-table" cellpadding="0" cellspacing="0"
                           role="presentation">
                      <tr>
                        <td>
                                                        <span style="font-weight: 600;">Your account has been
                                                            temporarily locked.</span>
                        </td>
                      </tr>
                    </table>
{{{ message_html }}}
<table class="attributes" width="100%" cellpadding="0" cellspacing="0"
                           role="presentation">
                      <tr>
                        <td class="attributes_content">
                          <table width="100%" cellpadding="0" cellspacing="0"
                                 role="presentation">
                            <tr>
                              <td class="attributes_item">
                                <strong>Lockout Duration:</strong> {{
                                  lockoutMinutes
                                }} minutes
                              </td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                    </table>
{{{ closing_html }}}
