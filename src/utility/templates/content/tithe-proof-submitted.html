{{{ message_html }}}
<table class="details-table" cellpadding="0" cellspacing="0" role="presentation">
                      <tr>
                        <td class="label"><strong>Amount</strong></td>
                        <td>{{ amount }}</td>
                      </tr>
                      <tr>
                        <td class="label"><strong>Date</strong></td>
                        <td>{{ paymentDate }}</td>
                      </tr>
                      <tr>
                        <td class="label"><strong>Proof ID</strong></td>
                        <td
                          style="font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px;">
                          {{ proofId }}

                      </tr>
                    </table>
{{{ closing_html }}}
