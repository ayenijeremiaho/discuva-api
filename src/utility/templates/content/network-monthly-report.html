{{#if heading}}<h1>{{ heading }}</h1>{{/if}}
{{{ message_html }}}
<table class="figures-table" cellpadding="0" cellspacing="0" role="presentation">
  {{#each figures}}
  <tr>
    <td>{{ label }}</td>
    <td class="figure">{{ value }}</td>
  </tr>
  {{/each}}
</table>
{{#if attention.length}}
<p class="attention-title"><strong>Worth a look</strong></p>
<ul class="attention-list">
  {{#each attention}}
  <li><strong>{{ path }}</strong>: {{ detail }}</li>
  {{/each}}
</ul>
{{/if}}
<table cellpadding="0" cellspacing="0" role="presentation" style="margin: 24px 0;">
  <tr>
    <td>
      <a href="{{admin_login_url}}" class="button" target="_blank">Open the network report</a>
    </td>
  </tr>
</table>
{{{ closing_html }}}
