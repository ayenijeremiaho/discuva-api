<h1>Session Report</h1>

<div class="report-badge">
  <p>{{ serviceName }} &mdash; {{ date }}</p>
</div>

<p>The service programme session has ended. Below is a summary for your records. Full analytics are
  available in the Discuva admin dashboard.</p>

<table width="100%" cellpadding="0" cellspacing="0" role="presentation">
  <tr class="stat-row">
    <td style="padding: 10px 0; border-top: 1px solid rgba(18,18,18,0.08);">
      <span class="stat-label">Session Code</span><br>
      <span class="stat-value">{{ sessionCode }}</span>
    </td>
  </tr>
</table>

<p style="margin-top: 35px; color: #8A817C;">God bless you,<br>
  <span style="color: #121212; font-weight: 500;">{{ church_name }} Team</span>
</p>
