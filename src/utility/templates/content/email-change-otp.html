{{#if heading}}<h1>{{ heading }}</h1>{{/if}}
{{{ message_html }}}
<table class="otp-table" cellpadding="0" cellspacing="0"
                           role="presentation">
                      <tr>
                        <td>
                          <div class="otp-code">{{ otp }}</div>
                        </td>
                      </tr>
                    </table>
<p style="text-align: center; font-size: 14px; color: #8A817C;">This code
                      expires in <strong style="font-weight: 600;">{{ expiresMinutes }}
                        minutes</strong> and can only be used once.</p>
<table class="alert-table" cellpadding="0" cellspacing="0"
                           role="presentation">
                      <tr>
                        <td>
                          <strong>Didn't request this?</strong> You can safely ignore this
                          email — your account email has not been changed. No further action
                          is needed.
                        </td>
                      </tr>
                    </table>
{{{ closing_html }}}
