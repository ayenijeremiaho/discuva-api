{{#if heading}}<h1>{{ heading }}</h1>{{/if}}
{{{ message_html }}}
<table class="attributes" width="100%" cellpadding="0" cellspacing="0" role="presentation">
                      <tr>
                        <td class="attributes_content">
                          <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
                            <tr>
                              <td class="attributes_item">
                                <strong>Temporary Password:</strong> {{ newPassword }}
                              </td>
                            </tr>
                            <tr>
                              <td class="attributes_item">
                                <strong>Login URL:</strong> <a href="{{login_url}}">Log In Now</a>
                              </td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                    </table>
<table class="body-action" align="center" width="100%" cellpadding="0" cellspacing="0"
                           role="presentation">
                      <tr>
                        <td align="center">
                          <a href="{{login_url}}" class="button" target="_blank">Log In Now</a>
                        </td>
                      </tr>
                    </table>
<p style="margin-top: 16px; font-size: 13px; color: #8A817C; text-align: center;">Can't click the
                      button? Copy and paste this link into your browser:</p>
<p
                      style="word-break: break-all; font-size: 12px; text-align: center; background-color: #f5f5f5; padding: 10px 16px; border-radius: 4px; margin: 0 0 24px;">
                      <a href="{{login_url}}" style="color: #4F46E5; text-decoration: none;">{{ login_url }}</a></p>
{{{ closing_html }}}
