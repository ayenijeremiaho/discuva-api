{{#if heading}}<h1>{{ heading }}</h1>{{/if}}
{{{ message_html }}}
{{#if served.length}}
<p class="list-title"><strong>Who served where</strong></p>
<table class="served-table" cellpadding="0" cellspacing="0" role="presentation">
  {{#each served}}
  <tr><td>{{ name }}</td><td class="teams">{{ teams }}</td></tr>
  {{/each}}
</table>
{{/if}}
{{{ closing_html }}}
