{{#if heading}}<h1>{{ heading }}</h1>{{/if}}
{{{ message_html }}}
<table class="attributes" width="100%" cellpadding="0" cellspacing="0" role="presentation">
  <tr>
    <td class="attributes_content">
      <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
        <tr><td class="attributes_item"><strong>Amount:</strong> {{ amount }}</td></tr>
        <tr><td class="attributes_item"><strong>Facility:</strong> {{ facilityName }}</td></tr>
        <tr><td class="attributes_item"><strong>Date:</strong> {{ bookingDate }}</td></tr>
      </table>
    </td>
  </tr>
</table>
<table class="body-action" align="center" width="100%" cellpadding="0" cellspacing="0" role="presentation">
  <tr><td align="center"><a href="{{login_url}}/facility-rental" class="button" target="_blank">View booking</a></td></tr>
</table>
{{{ closing_html }}}
