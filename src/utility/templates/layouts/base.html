<!DOCTYPE html
  PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="color-scheme" content="light only" />
  <meta name="supported-color-schemes" content="light only" />
  <title>{{ subject }}</title>
  <style type="text/css" rel="stylesheet" media="all">
      body {
          width: 100% !important;
          height: 100%;
          margin: 0;
          padding: 0;
          -webkit-text-size-adjust: none;
          background-color: #F4F3EF;
          color: #1F1F1F;
      }

      body,
      td,
      th {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      a {
          color: {{ brand_color }};
          text-decoration: underline;
      }

      a img {
          border: none;
      }

      td {
          word-break: break-word;
      }

      .preheader {
          display: none !important;
          visibility: hidden;
          mso-hide: all;
          font-size: 1px;
          line-height: 1px;
          max-height: 0;
          max-width: 0;
          opacity: 0;
          overflow: hidden;
      }

      h1 {
          margin: 0 0 16px;
          color: #121212;
          font-size: 24px;
          line-height: 1.3;
          font-weight: 500;
          letter-spacing: -0.01em;
          text-align: left;
      }

      td,
      th {
          font-size: 16px;
      }

      p,
      ul,
      ol,
      blockquote {
          margin: .4em 0 1.1875em;
          font-size: 15px;
          line-height: 1.65;
          font-weight: 400;
      }

      p {
          color: #2B2B2B;
      }

      p.sub {
          font-size: 12px;
          line-height: 1.6;
          color: #8A817C;
      }

      .church-name {
          color: #FFFFFF;
          font-size: 17px;
          font-weight: 600;
          letter-spacing: 0.01em;
      }

      .button {
          background-color: {{ brand_color }};
          border-top: 13px solid {{ brand_color }};
          border-right: 28px solid {{ brand_color }};
          border-bottom: 13px solid {{ brand_color }};
          border-left: 28px solid {{ brand_color }};
          display: inline-block;
          color: #FFFFFF !important;
          text-decoration: none;
          border-radius: 8px;
          font-size: 13px;
          font-weight: 600;
          text-transform: uppercase;
          letter-spacing: 0.05em;
          -webkit-text-size-adjust: none;
          box-sizing: border-box;
      }

      .attributes {
          margin: 0 0 21px;
      }

      .attributes_content {
          background-color: {{ soft_color }};
          padding: 16px;
          border-radius: 8px;
      }

      .attributes_item {
          padding: 4px 0;
          color: #121212;
          font-size: 14px;
      }

      .body-action {
          width: 100%;
          margin: 30px auto;
          padding: 0;
          text-align: center;
      }

      .highlight {
          background-color: {{ soft_color }};
          padding: 18px 20px;
          border-left: 3px solid {{ brand_color }};
          margin: 24px 0;
          border-radius: 8px;
      }

      .highlight p {
          color: #121212;
          margin: 0;
          font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
          font-size: 14px;
          font-style: normal;
          line-height: 1.5;
      }

      .reminder-badge {
          background-color: {{ soft_color }};
          padding: 18px 20px;
          border-left: 3px solid {{ brand_color }};
          margin: 24px 0;
          border-radius: 8px;
      }

      .reminder-badge p {
          color: #121212;
          margin: 0;
          font-weight: 600;
          font-size: 16px;
      }

      .details-table {
          width: 100%;
          background: {{ soft_color }};
          margin: 24px 0;
          border-collapse: separate;
          border-radius: 8px;
      }

      .details-table td {
          padding: 12px 20px;
          font-size: 14px;
          line-height: 1.4;
          vertical-align: top;
          color: #121212;
      }

      .details-table td.label {
          width: 120px;
          color: #6F6863;
          font-weight: 600;
          text-transform: uppercase;
          font-size: 11px;
          letter-spacing: 0.05em;
          padding-right: 0;
      }

      @media only screen and (max-width: 600px) {
          .email-outer {
              padding: 16px 10px !important;
          }

          .masthead {
              padding: 28px 24px 24px !important;
          }

          .content-cell {
              padding: 28px 24px 32px !important;
          }

          .button {
              width: 100% !important;
              text-align: center !important;
          }
      }
{{{ extra_styles }}}
  </style>
</head>

<body style="margin: 0; padding: 0; background-color: #F4F3EF;">
<span class="preheader">{{ preheader }}</span>
<table class="email-wrapper" width="100%" cellpadding="0" cellspacing="0" role="presentation" bgcolor="#F4F3EF"
       style="width: 100%; background-color: #F4F3EF;">
  <tr>
    <td class="email-outer" align="center" style="padding: 32px 16px;">
      <table class="email-card" width="600" cellpadding="0" cellspacing="0" role="presentation" bgcolor="#FFFFFF"
             style="width: 100%; max-width: 600px; background-color: #FFFFFF; border: 1px solid #E7E4DE; border-radius: 16px; overflow: hidden;">
        <tr>
          <td class="masthead" align="center" bgcolor="{{ brand_color }}"
              style="padding: 32px 40px 28px; text-align: center; background-color: {{ brand_color }};">
            {{#if logo_url}}
            <!-- Every logo sits on the same white tile, sized to fit 200x64 at its own proportions. -->
            <table role="presentation" cellpadding="0" cellspacing="0" align="center" style="margin: 0 auto 16px;">
              <tr>
                <td bgcolor="#FFFFFF"
                    style="background-color: #FFFFFF; border-radius: 14px; padding: 12px 18px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);">
                  {{#if logo_width}}
                  <img src="{{ logo_url }}" alt="{{ church_name }}" width="{{ logo_width }}" height="{{ logo_height }}"
                       style="display: block; width: {{ logo_width }}px; height: {{ logo_height }}px; border: 0; outline: none;" />
                  {{else}}
                  <img src="{{ logo_url }}" alt="{{ church_name }}"
                       style="display: block; width: auto; height: auto; max-width: 200px; max-height: 64px; border: 0; outline: none;" />
                  {{/if}}
                </td>
              </tr>
            </table>
            {{/if}}
            <div class="church-name" style="color: #FFFFFF;">{{ church_name }}</div>
          </td>
        </tr>
        <tr>
          <td class="content-cell" style="padding: 32px 40px 40px;">
            <div>
{{{ content }}}
              {{#if show_signoff}}
              <p style="margin-top: 32px; color: #8A817C;">{{ signoff }}<br><span
                style="color: #121212; font-weight: 500;">{{ signature }}</span></p>
              {{/if}}
            </div>
          </td>
        </tr>
      </table>
      <table class="email-footer" width="600" cellpadding="0" cellspacing="0" role="presentation"
             style="width: 100%; max-width: 600px;">
        <tr>
          <td align="center" style="padding: 24px 24px 8px;">
            <p class="sub" style="text-align: center; margin: 0;">
              {{ church_name }}<br>{{ church_address }}{{#if support_email}}<br>Need help? Contact us at {{ support_email }}{{/if}}
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
