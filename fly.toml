# Fly.io app config for discuva-api.
#
# No [build] section on purpose — this app is never built by Fly. CI builds
# the image on GitHub Actions and pushes it to GHCR; the deploy workflow
# runs `flyctl deploy --image ghcr.io/<owner>/discuva-api:<sha>`, which just
# pulls that already-built image (via the runner's GHCR login) and pushes it
# into Fly's registry — Fly's own remote-builder machine is never invoked,
# which is the whole point (it's billed separately from app compute).
#
# One-time setup, not done by this file or CI:
#   fly apps create discuva-api
#   fly secrets set DATABASE_URL=... REDIS_URL=... JWT_SECRET=... \
#     REFRESH_JWT_SECRET=... VAPID_PRIVATE_KEY=... VAPID_PUBLIC_KEY=... \
#     VAPID_SUBJECT=... <every other REQUIRED var in .env.example>
#   fly certs add api.discuva.org
# `fly secrets set` values never appear in this file, CI logs, or the repo —
# they're stored encrypted by Fly and injected into the machine at runtime.
app = "discuva-api"
primary_region = "fra" # Frankfurt — matches Neon's eu-central-1 (AWS Frankfurt) host in env/api.env; cross-region DB calls add real latency to every request.

kill_signal = "SIGINT"
kill_timeout = "10s"

[experimental]
  auto_rollback = true

# Applies pending tenant-schema migrations (src/migrations/tenant/) across
# every active tenant on every deploy, closing the gap public-schema
# migrations don't have (those already run automatically on boot via
# migrationsRun: true in db.config.ts). Runs on a fresh machine using the
# *new* image, before Fly promotes this release to receive traffic — if
# migrate-all-tenants.js exits non-zero (its own fail-fast policy, see that
# file's comments), Fly never switches traffic over, and auto_rollback
# above reverts to the last working release. Same app secrets/network
# access as the real machines, nothing extra to configure.
[deploy]
  release_command = "node dist/migrate-all-tenants.js"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1 # keeps at least one warm instance — avoids a cold-start hit on every tenant's API traffic. Socket.IO gateways (service-session, game-session) also don't need Fly's sticky-session support: RedisIoAdapter already makes the API horizontally scalable across machines.
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s" # was 15s — /health pings CacheService.ping() (a real Redis round-trip), so this alone was ~5,760 idle Redis reads/day. 30s still catches a genuine outage within a minute, well within an acceptable detection window.
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb" # bump if migrations or report-generation endpoints OOM under real tenant load — no measured baseline yet.
